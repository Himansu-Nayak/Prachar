spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:prachar_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

prachar:
  cors:
    allowed-origins: "http://localhost:3000"
  security:
    jwt-secret: "test_secret_key_at_least_256_bits_length_for_hmac_sha256_prachar_test_environment"
