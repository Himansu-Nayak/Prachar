spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:prachar_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

prachar:
  cors:
    allowed-origins: "http://localhost:3000"
  jwt:
    secret: "test_secret_key_at_least_256_bits_length_for_hmac_sha256_prachar_test_environment"
    access-token-minutes: 15
    refresh-token-days: 7
  razorpay:
    key-id: "rzp_test_placeholder_key"
    key-secret: "test_secret_key_for_razorpay_hmac_sha256_testing_only"
    webhook-secret: "test_webhook_secret_for_razorpay_hmac_sha256_testing_only"
    simulation-mode: true

