<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="kcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1118"/>
      <stop offset="50%" stop-color="#070C12"/>
      <stop offset="100%" stop-color="#04070A"/>
    </linearGradient>
    <linearGradient id="kcCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12202E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D1722" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#kcBg)"/>
  <circle cx="400" cy="300" r="280" fill="#0EA5E9" opacity="0.06" filter="blur(60px)"/>

  <!-- Corner Crop Marks -->
  <path d="M 32 48 L 32 32 L 48 32" fill="none" stroke="rgba(14,165,233,0.3)" stroke-width="1.5"/>
  <path d="M 768 48 L 768 32 L 752 32" fill="none" stroke="rgba(14,165,233,0.3)" stroke-width="1.5"/>
  <path d="M 32 552 L 32 568 L 48 568" fill="none" stroke="rgba(14,165,233,0.3)" stroke-width="1.5"/>
  <path d="M 768 552 L 768 568 L 752 568" fill="none" stroke="rgba(14,165,233,0.3)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="64" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="3">CASE STUDY • HEALTHCARE SECTOR</text>
  <text x="590" y="60" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#A3A3A3" letter-spacing="1.5">P1 FULL PAGE • 2026</text>
  <line x1="64" y1="76" x2="736" y2="76" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <g transform="translate(64, 100)">
    <rect width="672" height="440" rx="20" fill="url(#kcCard)" stroke="rgba(14,165,233,0.2)" stroke-width="1"/>

    <!-- Left: Print Creative Layout Specimen -->
    <g transform="translate(40, 40)">
      <rect width="320" height="360" rx="12" fill="#FAF8F5" stroke="#E5E0D8" stroke-width="1"/>
      
      <!-- Top Clinical Banner -->
      <rect x="0" y="0" width="320" height="90" rx="12" fill="#0369A1"/>
      <rect x="0" y="78" width="320" height="12" fill="#0369A1"/>
      <text x="24" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">KALINGA CLINIC</text>
      <text x="24" y="64" font-family="'Noto Sans Odia', sans-serif" font-size="12" font-weight="600" fill="#BAE6FD">କଳିଙ୍ଗ କ୍ଲିନିକ୍ • ନୟାପଲ୍ଲୀ, ଭୁବନେଶ୍ୱର</text>

      <!-- Department Callouts -->
      <text x="24" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0F172A">Multi-Specialty Consultation &amp; Diagnostics</text>
      <text x="24" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="400" fill="#64748B">Cardiology • Pediatrics • Orthopedics • Dental</text>
      <text x="24" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="400" fill="#64748B">Plot 104, IRC Village, Nayapalli, Bhubaneswar</text>

      <!-- Emergency Hotline Box -->
      <rect x="24" y="190" width="272" height="64" rx="8" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1"/>
      <text x="40" y="216" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0369A1">DAILY OPD: 08:00 AM – 09:00 PM</text>
      <text x="40" y="236" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="500" fill="#0284C7">Emergency Helpline: +91 674 256 8900</text>

      <!-- Bottom Dynamic QR Box -->
      <g transform="translate(24, 274)">
        <rect width="64" height="64" rx="6" fill="#0F172A"/>
        <rect x="8" y="8" width="20" height="20" fill="#38BDF8"/>
        <rect x="12" y="12" width="12" height="12" fill="#0F172A"/>
        <rect x="36" y="8" width="20" height="20" fill="#38BDF8"/>
        <rect x="40" y="12" width="12" height="12" fill="#0F172A"/>
        <rect x="8" y="36" width="20" height="20" fill="#38BDF8"/>
        <rect x="12" y="40" width="12" height="12" fill="#0F172A"/>
        <rect x="36" y="36" width="8" height="8" fill="#38BDF8"/>
        <rect x="48" y="48" width="8" height="8" fill="#38BDF8"/>

        <text x="76" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A">INSTANT ONLINE</text>
        <text x="76" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0284C7">OPD BOOKING</text>
        <text x="76" y="58" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="600" fill="#64748B">prachar.in/u/kalingaclinic</text>
      </g>
