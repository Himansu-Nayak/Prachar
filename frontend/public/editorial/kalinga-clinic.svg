    <!-- Right: Commercial Impact Ledger -->
    <g transform="translate(390, 50)">
      <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Kalinga Super-Specialty</text>
      <text x="0" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#A3A3A3">Prime Healthcare Facility • Nayapalli Sector</text>

      <!-- Metrics Row -->
      <g transform="translate(0, 90)">
        <rect width="240" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38BDF8">RESIDENTIAL SATURATION</text>
        <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Nayapalli &amp; IRC Village</text>
      </g>

      <g transform="translate(0, 165)">
        <rect width="240" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#10B981">PATIENT ACQUISITION</text>
        <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">+42% OPD Inquiries</text>
      </g>

      <g transform="translate(0, 240)">
        <rect width="240" height="60" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F59E0B">PRINT DURABILITY</text>
        <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">30+ Days Retention</text>
      </g>
