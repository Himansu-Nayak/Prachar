        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#34D399">TECH CORRIDOR DROPS</text>
        <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">8,200+ Copies in Patia</text>
