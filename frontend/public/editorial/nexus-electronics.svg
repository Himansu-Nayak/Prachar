      <stop offset="0%" stop-color="#0E1410"/>
      <stop offset="50%" stop-color="#090E0B"/>
      <stop offset="100%" stop-color="#040705"/>
    </linearGradient>
    <linearGradient id="neCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15241B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E1912" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#neBg)"/>
  <circle cx="400" cy="300" r="280" fill="#10B981" opacity="0.06" filter="blur(60px)"/>

  <!-- Corner Crop Marks -->
  <path d="M 32 48 L 32 32 L 48 32" fill="none" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  <path d="M 768 48 L 768 32 L 752 32" fill="none" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  <path d="M 32 552 L 32 568 L 48 568" fill="none" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  <path d="M 768 552 L 768 568 L 752 568" fill="none" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>

  <!-- Header -->
  <text x="64" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34D399" letter-spacing="3">CASE STUDY • CONSUMER TECH &amp; APPLIANCES</text>
  <text x="590" y="60" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#A3A3A3" letter-spacing="1.5">P4 DIRECTORY SPOT • 2026</text>
