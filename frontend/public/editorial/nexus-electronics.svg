        <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38BDF8">MONTHLY ROI</text>
        <text x="18" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">7.8x Attributed Sales</text>
