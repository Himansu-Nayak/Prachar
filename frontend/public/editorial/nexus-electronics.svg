      <text x="24" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">NEXUS ELECTRONICS</text>
      <text x="24" y="64" font-family="'Noto Sans Odia', sans-serif" font-size="12" font-weight="600" fill="#A7F3D0">ନେକ୍ସସ ଇଲେକ୍ଟ୍ରୋନିକ୍ସ • ପଟିଆ, ଇନଫୋସିଟି</text>

      <text x="24" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#1C1917">Smart TVs • Home Appliances • Laptops</text>
