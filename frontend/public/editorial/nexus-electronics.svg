        <rect x="12" y="12" width="12" height="12" fill="#1C1917"/>
        <rect x="36" y="8" width="20" height="20" fill="#34D399"/>
        <rect x="40" y="12" width="12" height="12" fill="#1C1917"/>
        <rect x="8" y="36" width="20" height="20" fill="#34D399"/>
        <rect x="12" y="40" width="12" height="12" fill="#1C1917"/>
        <rect x="36" y="36" width="8" height="8" fill="#34D399"/>
        <rect x="48" y="48" width="8" height="8" fill="#34D399"/>

