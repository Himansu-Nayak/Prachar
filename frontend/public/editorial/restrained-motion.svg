<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090C"/>
      <stop offset="60%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="curveGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="60%" stop-color="#E4B592"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="motionSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB703" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#bgGrad4)"/>

  <!-- Top Metadata Ledger -->
  <text x="64" y="58" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#FFB703" letter-spacing="2">MOTION CHOREOGRAPHY &amp; EASING MATRIX</text>
  <text x="590" y="58" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717A">INTERPOLATION: EXPO-OUT</text>
  <line x1="64" y1="72" x2="736" y2="72" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Main Left Motion Canvas (Cubic Bezier Graph) -->
  <g transform="translate(64, 100)">
    <!-- Motion Chart Frame -->
    <rect x="0" y="0" width="420" height="270" rx="14" fill="#0D0D12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Coordinate Grid Lines -->
    <line x1="50" y1="30" x2="50" y2="230" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="50" y1="230" x2="380" y2="230" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <line x1="50" y1="50" x2="380" y2="50" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="215" y1="30" x2="215" y2="230" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Axis Labels -->
    <text x="36" y="54" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717A">1.0</text>
    <text x="36" y="140" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717A">0.5</text>
    <text x="36" y="234" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717A">0.0</text>
    <text x="50" y="246" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717A">0s</text>
    <text x="215" y="246" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717A">0.25s</text>
    <text x="370" y="246" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717A">0.50s</text>

    <!-- Glowing Background Area under Bezier Curve -->
    <path d="M 50 230 C 102 50 149 50 380 50 L 380 230 Z" fill="url(#motionSweep)"/>

    <!-- The Signature Easing Curve: cubic-bezier(0.16, 1, 0.3, 1) -->
    <path d="M 50 230 C 102 50 149 50 380 50" fill="none" stroke="url(#curveGradient)" stroke-width="3" stroke-linecap="round"/>

    <!-- Tangent Handles & Control Points -->
    <!-- P1 Handle (0.16, 1.0) -->
    <line x1="50" y1="230" x2="102" y2="50" stroke="#FFB703" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="102" cy="50" r="4.5" fill="#FFB703" stroke="#000000" stroke-width="1.5"/>
    <text x="112" y="44" font-family="'JetBrains Mono', monospace" font-size="8" fill="#FFB703">P1 (0.16, 1.0)</text>

    <!-- P2 Handle (0.30, 1.0) -->
    <line x1="380" y1="50" x2="149" y2="50" stroke="#0EA5E9" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="149" cy="50" r="4.5" fill="#0EA5E9" stroke="#000000" stroke-width="1.5"/>
    <text x="159" y="44" font-family="'JetBrains Mono', monospace" font-size="8" fill="#0EA5E9">P2 (0.30, 1.0)</text>

    <!-- Start & End Anchors -->
    <circle cx="50" cy="230" r="4" fill="#FFFFFF"/>
    <circle cx="380" cy="50" r="4" fill="#FFFFFF"/>

    <!-- Current Animation Playhead Scrubber -->
    <line x1="180" y1="30" x2="180" y2="230" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="180" cy="62" r="6" fill="#FFB703" stroke="#FFFFFF" stroke-width="2"/>
    <text x="192" y="80" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FFFFFF">T = 240MS</text>
  </g>

  <!-- Right Restrained Reveal Sequence Preview -->
  <g transform="translate(508, 100)">
    <!-- Stage 1 (Initial State - Low Opacity, Offset) -->
    <rect x="0" y="0" width="228" height="68" rx="10" fill="#14141A" fill-opacity="0.3" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="8" fill="#52525B">STAGE 01 • OPACITY: 0.15</text>
    <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#52525B">Offset: translateY(+16px)</text>

    <!-- Stage 2 (Deceleration Phase) -->
    <rect x="0" y="80" width="228" height="78" rx="10" fill="#181822" fill-opacity="0.6" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="16" y="104" font-family="'JetBrains Mono', monospace" font-size="8" fill="#A1A1AA">STAGE 02 • OPACITY: 0.65</text>
    <text x="16" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#D4D4D8">Decelerating: translateY(+4px)</text>
    <circle cx="206" cy="118" r="3" fill="#E4B592"/>

    <!-- Stage 3 (Settled State - Crisp, Full Opacity) -->
    <rect x="0" y="170" width="228" height="100" rx="10" fill="#1A1A26" stroke="#FFB703" stroke-width="1" stroke-opacity="0.6"/>
    <text x="16" y="196" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FFB703">STAGE 03 • COMPLETE (1.0)</text>
    <text x="16" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Natural Settled Rest</text>
    <text x="16" y="244" font-family="'JetBrains Mono', monospace" font-size="8" fill="#A1A1AA">ZERO SCROLL JITTER • 60 FPS</text>
    <circle cx="206" cy="220" r="4" fill="#10B981"/>
  </g>

  <!-- Bottom Timeline Ledger -->
  <line x1="64" y1="448" x2="736" y2="448" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="64" y="468" font-family="'JetBrains Mono', monospace" font-size="9" fill="#52525B">ANIMATION SERVES CONTENT • RESTRAINED TRANSITIONS • BHUBANESWAR 2026</text>
  <text x="660" y="468" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0EA5E9">SUBTLE</text>
</svg>
